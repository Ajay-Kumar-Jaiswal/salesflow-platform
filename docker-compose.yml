services:
  mysql:
    image: mysql:8.0
    container_name: salesflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-salesflow_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-salesflow}
      MYSQL_USER: ${DB_USER:-salesflow_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-salesflow_secure_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-salesflow_root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salesflow_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER:-salesflow_user}:${DB_PASSWORD:-salesflow_secure_pass}@mysql:3306/${DB_NAME:-salesflow}
      SECRET_KEY: ${SECRET_KEY:-super-secret-salesflow-key-production-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://localhost:8000
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: salesflow_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
